<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Визуальный профиль университета</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2035;
    --accent: #4f8cff;
    --text: #e8ecf5;
    --muted: #8b93a8;
    --green: #3ddc84;
    --yellow: #ffc857;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
  }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 30px;
  }
  .search-box {
    display: flex;
    gap: 10px;
    max-width: 500px;
    margin: 0 auto 40px;
  }
  input {
    flex: 1;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid #2a3350;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
  }
  button {
    padding: 14px 24px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    text-align: center;
    color: var(--muted);
    margin-bottom: 20px;
    min-height: 20px;
  }

  .filters {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #2a3350;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
  }
  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
  }

  .category-title {
    font-size: 20px;
    margin: 30px 0 16px;
    text-transform: capitalize;
    border-left: 3px solid var(--accent);
    padding-left: 12px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #232a45;
  }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    background: #232a45;
  }
  .card-body {
    padding: 12px 14px;
  }
  .card-title {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
     line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .badge-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge.high { background: rgba(61,220,132,0.15); color: var(--green); }
  .badge.mid { background: rgba(255,200,87,0.15); color: var(--yellow); }
  .badge.low { background: rgba(107,114,128,0.15); color: var(--gray); }
  .source-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .reason {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.4;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .time-badge {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  body {
  background: radial-gradient(circle at top, #151b2e, #0a0e18);
}
h1 {
  background: linear-gradient(90deg, #4f8cff, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
}
.card {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(79,140,255,0.15);
}
button {
  background: linear-gradient(90deg, #4f8cff, #6f6cff);
  transition: transform 0.15s ease;
}
button:hover {
  transform: scale(1.03);
}
input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,140,255,0.2);
}
</style>
</head>
<body>
<div class="container">
  <h1>Визуальный профиль университета</h1>
  <p class="subtitle">Введите название вуза — получите проверенные фото за секунды</p>

  <div class="search-box">
    <input type="text" id="universityInput" placeholder="Например: МГУ" />
    <button id="searchBtn" onclick="search()">Найти</button>
  </div>

  <div class="status" id="status"></div>
  <div class="time-badge" id="timeBadge"></div>
  <div id="summaryBox" style="max-width:700px;margin:0 auto 30px;text-align:center;color:var(--text);line-height:1.6;"></div>

  <div class="filters" id="filters" style="display:none;">
    <button class="filter-btn active" data-cat="all" onclick="filterCategory('all')">Все</button>
    <button class="filter-btn" data-cat="campus" onclick="filterCategory('campus')">Кампус</button>
    <button class="filter-btn" data-cat="dormitory" onclick="filterCategory('dormitory')">Общежитие</button>
    <button class="filter-btn" data-cat="library" onclick="filterCategory('library')">Библиотека</button>
    <button class="filter-btn" data-cat="classroom" onclick="filterCategory('classroom')">Аудитории</button>
    <button class="filter-btn" data-cat="city" onclick="filterCategory('city')">Город</button>
  </div>

  <div id="results"></div>
</div>

<script>
const API_URL = "";
let currentData = null;

async function search() {
  const university = document.getElementById("universityInput").value.trim();
  if (!university) return;

  const btn = document.getElementById("searchBtn");
  const status = document.getElementById("status");
  const results = document.getElementById("results");
  const filters = document.getElementById("filters");
  const timeBadge = document.getElementById("timeBadge");

  btn.disabled = true;
  status.textContent = "Ищем и проверяем фотографии...";
  results.innerHTML = "";
  filters.style.display = "none";
  timeBadge.textContent = "";

  try {
    const res = await fetch(`${API_URL}/profile?university=${encodeURIComponent(university)}`);
    if (!res.ok) throw new Error("Ошибка сервера");
    const data = await res.json();
    currentData = data;

    status.textContent = "";
    timeBadge.textContent = `Готово за ${data.search_time_seconds} сек`;
    filters.style.display = "flex";
    document.getElementById("summaryBox").textContent = data.summary || "";
    renderResults(data.categories, "all");
  } catch (e) {
    status.textContent = "Не удалось получить данные. Проверьте, запущен ли сервер.";
  } finally {
    btn.disabled = false;
  }
}

function filterCategory(cat) {
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector(`[data-cat="${cat}"]`).classList.add("active");
  if (currentData) renderResults(currentData.categories, cat);
}

function confidenceBadge(confidence) {
  if (confidence >= 80) return { cls: "high", label: `✓ ${confidence}%` };
  if (confidence >= 40) return { cls: "mid", label: `? ${confidence}%` };
  return { cls: "low", label: `не подтверждено` };
}

function renderResults(categories, filter) {
  const results = document.getElementById("results");
  results.innerHTML = "";

  const catNames = {
    campus: "Кампус",
    dormitory: "Общежитие",
    library: "Библиотека",
    classroom: "Аудитории",
    city: "Город"
  };

  const keys = filter === "all" ? Object.keys(categories) : [filter];
  let hasAny = false;

  for (const cat of keys) {
    const images = categories[cat] || [];
    if (images.length === 0) continue;
    hasAny = true;

    const title = document.createElement("div");
    title.className = "category-title";
    title.textContent = catNames[cat] || cat;
    results.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    images.forEach(img => {
      const v = img.verification || { confidence: 0, reason: "" };
      const badge = confidenceBadge(v.confidence || 0);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${img.url}" loading="lazy" onerror="this.style.opacity=0.2" />
        <div class="card-body">
          <div class="card-title">${img.title || ""}</div>
          <div class="badge-row">
            <a class="source-link" href="${img.source}" target="_blank">Источник →</a>
            <span class="badge ${badge.cls}">${badge.label}</span>
          </div>
          <div class="reason">${v.reason || ""}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    results.appendChild(grid);
  }

  if (!hasAny) {
    results.innerHTML = '<div class="empty-state">Фото в этой категории не найдено</div>';
  }
}

document.getElementById("universityInput").addEventListener("keypress", e => {
  if (e.key === "Enter") search();
});
</script>
</body>
</html>
